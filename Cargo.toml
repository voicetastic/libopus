[package]
name = "libopus"
# Matches the upstream libopus release we vendor (1.5.2, Apr 2024 —
# the latest stable from Xiph). If we apply local changes on top of
# the emcc build glue we bump with semver build metadata
# (e.g. `1.5.2+vt.1`).
version = "1.5.2"
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause"
description = "Vendored libopus (BSD-3-Clause, by Xiph.Org / Skype Limited / Broadcom / Octasic / Jean-Marc Valin) compiled to a standalone WebAssembly artifact via Emscripten. Built in FIXED_POINT mode (no float-only DSP, no analysis, no DNN). Includes thin non-variadic wrappers around opus_*_ctl (under `glue/`, BSD-3-Clause) so JS callers can dispatch the ctl operations across the wasm boundary — emscripten's STANDALONE_WASM doesn't pass variadic args from JS. Source under `vendor/` is unmodified upstream — see `vendor/COPYING`. Native (non-wasm32) builds are a no-op."
repository = "https://github.com/voicetastic/libopus"
homepage = "https://github.com/voicetastic/libopus"
documentation = "https://docs.rs/libopus"
readme = "README.md"
keywords = ["opus", "codec", "audio", "wasm", "emscripten"]
categories = ["multimedia::audio", "wasm", "external-ffi-bindings"]
# Explicit allowlist so `cargo package` produces a minimal, reproducible
# archive — covers the build glue, the C sources we actually compile,
# their headers, and the Makefile.am-style sources lists (we read these
# at build time for the canonical file lists).
include = [
    "src/**/*.rs",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "glue/**/*.c",
    "glue/**/*.h",
    "vendor/**/*.c",
    "vendor/**/*.h",
    "vendor/*_sources.mk",
    "vendor/COPYING",
    "vendor/AUTHORS",
    "vendor/README",
]

# No public API for native consumers — the desktop / Android path keeps
# its existing `audiopus` (system libopus FFI) link. This crate exists
# to host the wasm build artifact, exposed via `wasm_module_bytes()` on
# wasm32. Native builds are a no-op (build.rs returns early).
[lib]
path = "src/lib.rs"

[package.metadata.docs.rs]
# Build for both targets so `wasm_module_bytes()` lands in the docs with
# an "Available on wasm32 only" badge, and the native (no-op) view is
# also rendered. Default target is x86_64-unknown-linux-gnu; adding
# wasm32-unknown-unknown surfaces the wasm-gated public API.
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
